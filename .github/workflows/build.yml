name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The APK carries fix 07's module, whose .so files are built here first.
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
      - name: Build cast feedback shim into its module
        run: sh fixes/07-cast-feedback-shim/build-shim.sh "${{ steps.ndk.outputs.ndk-path }}"

      # Sign with the release key when the repository has it (secrets aren't given to
      # pull requests from forks; those builds use the fixed key in app/).
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.QE_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "QE_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "No release key secret: signing with the fixed key in app/"
          fi

      - name: Build
        env:
          QE_RELEASE_STORE_PASSWORD: ${{ secrets.QE_RELEASE_STORE_PASSWORD }}
          QE_RELEASE_KEY_ALIAS: ${{ secrets.QE_RELEASE_KEY_ALIAS }}
          QE_RELEASE_KEY_PASSWORD: ${{ secrets.QE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PciRun=${{ github.run_number }}

      - name: Signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E 'SHA-256|DN'

      # QuestEnhancer-v<version>-r<run>-<short commit>[-<branch>].apk; main has no
      # branch suffix. The artifact has the same name.
      - name: Name the APK
        id: name
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          ref="${{ github.head_ref || github.ref_name }}"
          short=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
          name="QuestEnhancer-v$ver-r${{ github.run_number }}-$short"
          [ "$ref" = main ] || name="$name-${ref##*/}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

  fixes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build Developer Options app
        working-directory: apps/devoptions
        run: gradle --no-daemon :app:assembleDebug
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b           # = 26.1.10909125
      - name: Build cast feedback shim into its module
        run: sh fixes/07-cast-feedback-shim/build-shim.sh "${{ steps.ndk.outputs.ndk-path }}"
      - name: Short commit
        id: short
        run: echo "sha=$(echo '${{ github.event.pull_request.head.sha || github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Collect APKs and pack Magisk modules
        run: |
          mkdir -p out
          cp apps/devoptions/app/build/outputs/apk/debug/app-debug.apk out/devoptions-${{ github.run_number }}.apk
          for m in fixes/*/module; do
            fix=$(basename "$(dirname "$m")")
            (cd "$m" && zip -r -X "$GITHUB_WORKSPACE/out/$fix-r${{ github.run_number }}.zip" . -x '.gitkeep' -x '*/.gitkeep')
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: quest1-fixes-r${{ github.run_number }}-${{ steps.short.outputs.sha }}
          path: out/
